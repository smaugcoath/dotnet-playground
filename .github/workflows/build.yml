name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/*
      - fix/*
  pull_request:

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: Pocs.Aspire.sln

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution ${{ env.SOLUTION_FILE }}
          --configuration Release --no-build
          --results-directory TestResults --report-xunit-trx
          --coverage --coverage-output-format cobertura

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:TestResults/coverage -reporttypes:MarkdownSummaryGithub
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
