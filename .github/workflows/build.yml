name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: Pocs.Aspire.sln

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution ${{ env.SOLUTION_FILE }}
          --configuration Release --no-build
          --results-directory TestResults --report-xunit-trx
          --coverage --coverage-output-format cobertura

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:TestResults/coverage -reporttypes:MarkdownSummaryGithub
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
